name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next 16 의 build 는 ESLint 를 돌리지 않으므로 따로 실행한다
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # NEXT_PUBLIC_ 값은 클라이언트 번들에 그대로 노출되므로 secrets 가 아닌 vars 로 관리한다
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
