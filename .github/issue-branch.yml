# create-issue-branch 설정
# https://github.com/robvanderleek/create-issue-branch

# auto      : 이슈에 담당자가 지정되면 자동 생성 (워크플로의 issues.assigned 와 짝)
# chatops   : 코멘트로 `/cib` 를 쳐야만 생성
# immediate : 이슈가 열리는 즉시 생성
mode: auto

# 브랜치 이름 형식: {접두사}{이슈번호}-{이슈제목}
# 이슈 #12 "러닝 결과 화면 포인트 애니메이션" → feat-12-러닝-결과-화면-포인트-애니메이션
#
# 접두사는 아래 branches 에서 라벨별로 정한다.
#
# 미리 정의된 값도 쓸 수 있다:
#   tiny  → i12
#   short → issue-12
#   full  → issue-12-러닝-결과-화면-포인트-애니메이션
branchName: '${issue.number}-${issue.title}'

# git 브랜치명에 못 쓰는 문자를 무엇으로 바꿀지
gitSafeReplacementChar: '-'

# 위 규칙 외에 추가로 제거할 문자 (괄호, 문장부호 등)
gitReplaceChars: '()[]{}!?,.'

# 라벨에 따라 접두사를 붙인다.
# 위에서부터 먼저 매칭되는 것이 적용되고, '*' 는 아무 라벨도 안 맞을 때의 기본값이다.
branches:
  - label: bug
    prefix: fix-
  - label: documentation
    prefix: docs-
  - label: refactor
    prefix: refactor-
  - label: chore
    prefix: chore-
  # 기본값 — 라벨이 없거나 위에 안 걸리면 전부 feat-
  - label: '*'
    prefix: feat-

# 브랜치명에 이슈 번호가 있으면 PR 을 이슈에 자동 연결
autoLinkIssue: true

# PR 이 머지되면 연결된 이슈를 자동으로 닫는다
autoCloseIssue: true

# PR 에 이슈의 라벨/담당자를 복사
copyIssueLabelsToPR: true
copyIssueAssigneeToPR: true

# 브랜치 생성 시 이슈에 안내 코멘트를 남긴다 (true 로 하면 조용히 동작)
silent: false
